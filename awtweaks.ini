; AWTweaks - Alan Wake Remastered engine tweakable overrides
;
; This file is re-read automatically while the game runs: save it and the
; changes apply within a fraction of a second (no restart needed for most).
; Delete or comment out (;) a line and the engine's original value is restored.
; Every tweakable with its original value is listed in awtweaks_dump.txt,
; which the mod writes next to this file.
;
; Values: floats (1.5), bools (true/false), colors (r, g, b[, a]).
; Names must match the engine's exactly, including spaces and capitals.

[Settings]
Enabled=true
; Re-write values every poll, in case the game resets them (e.g. on preset change).
Enforce=true
; Clamp values to the engine's own slider range. Off lets you go past it - at your own risk.
ClampToRange=false
; Write every registered tweakable with its current value to awtweaks_dump.txt.
DumpAll=true
PollMs=100

; Hotkeys (only while the game window has focus). F1-F24, a letter/digit, 0x.. or None.
; ToggleKey: A/B - every override (and LightShadowScale) off = stock, press again = on.
;   High beep = mod on, low beep = stock.
ToggleKey=F10
; PresetKey: cycle the Quality presets: Stock -> Ultra+ -> Cinematic -> Stock.
;   One short beep per position, a low beep for Stock.
;   If the mod is toggled off, this also switches it back on.
PresetKey=F9
Beep=true
; Presets active at start, comma-separated (None = only your own overrides).
; The ReShade overlay's "Use these presets at startup" button rewrites this line.
Preset=Cinematic

[Shadows]
; Size of the shared shadow atlas that every sun cascade and spot/point light
; shadow is packed into. Read at game start only.
;   1 = 8192x4096 (game default, ~256 MB colour+depth)
;   2 = 16384x8192 (D3D12 max texture size, ~1 GB VRAM)
; Cascade resolutions above 2048 (Ultra+, Cinematic) need 2. Without it the mod
; caps them at 2048, because the game's own packer hangs if they don't fit.
AtlasScale=2
; Flashlight / spot / point-light shadow resolution multiplier: 1, 2 or 4.
; Lights request 512 or 1024 on Very High/Ultra; 2 -> 1024/2048. Capped at 4096.
; If the atlas runs short the engine halves light shadows again, so this
; degrades gracefully. Applies live (with AtlasScale=2, otherwise restart).
LightShadowScale=2

[FreeCamera]
; The developers' free camera. ToggleKey cycles:
;   normal -> free camera (fly) -> free camera frozen (Alan playable) -> normal
; While flying: move = your move keys / left stick, look = mouse / right
; stick, Space = up, Left Ctrl = down, Left Shift = faster, Left Alt = slower.
; Alan doesn't move, look, jump or shoot meanwhile.
; Enabled is read at game start; the rest applies live.
Enabled=true
ToggleKey=F7
LookSensitivity=1.0
InvertPitch=false
; Base speed is the tweakable Free Camera:Movement Speed (stock 70).

[PhotoMode]
; The game's own developer controls, revived. Pair with the free camera (F7).
; Enabled is read at game start; the keys apply live.
; Keys: F1-F24, a letter/digit, PageUp, PageDown, Home, End, Insert, Delete,
; Backspace, Space, Minus, Plus, NumpadMinus, NumpadPlus, Pause, 0x.. or None.
Enabled=true
; Freeze / unfreeze the game (the free camera still flies while paused).
PauseKey=F8
; Advance exactly one frame while paused.
StepKey=F6
; Game speed: 0.01, 0.05, 0.1, 0.25, 0.5, 1, 2, 4x. The overlay has a slider.
SlowerKey=Minus
FasterKey=Plus
NormalSpeedKey=Backspace
; Time of day: -/+ 1 minute of game clock per press (hold to keep going);
; with Shift held, 1 hour. Scenes that script their own lighting may ignore it.
TimeBackwardKey=PageDown
TimeForwardKey=PageUp

[Shaders]
; Needs the ReShade add-on (AWTweaks.addon64). Read at game start.
; ShadowShader - the sun/moon shadow filter shader:
;   Enhanced = AWTweaks' rebuild of the game's shader: pixel-for-pixel identical until
;              the soft/contact shadow settings below turn on (they're in the presets)
;   Original = the game's own
;   Debug    = the rebuild with a test pattern: sun/moon shadows vanish in vertical
;              stripes - 32 pixels wide, or 128 while soft/contact shadows are on
ShadowShader=Enhanced
; AOShader - the ambient occlusion shader (NVIDIA HBAO+):
;   Original = the game's own
;   Enhanced = AWTweaks' rebuild of it: pixel-for-pixel identical until
;              AWTweaks:GTAO turns on (see [Tweaks] notes)
;   Debug    = the rebuild with a test pattern: full occlusion in 32-pixel stripes,
;              128-pixel stripes while GTAO is on
AOShader=Enhanced
; SSSShader - the skin subsurface-scattering blur:
;   Original = the game's own
;   Debug    = a test pattern instead of the blur: on skin, green stripes show where it
;              runs, red stripes grow with Skin Shader:SSS Width (full red at 0.01)
SSSShader=Original
; SpotShader - shadow-casting spotlights (Alan's flashlight, some lamps):
;   Enhanced = AWTweaks' rebuild of the game's shader: pixel-for-pixel identical
;   Original = the game's own
;   Debug    = the rebuild with a test pattern: spotlight light vanishes in 32-pixel
;              stripes
SpotShader=Enhanced

[Debug]
; Log every shadow-atlas region the renderer requests (size, caller) every 5 s.
; Read at game start only.
LogShadowAllocs=false
; Log which controls the game reads (free camera debugging). Read at game start.
LogFreeCamInput=false
; Needs the add-on: log which pixel shaders from these files in
; shaders\build\pc_DXIL draw, every 5 s (e.g. SSSSS,Skin_d3t,Eye). Empty = off.
; Read at game start.
WatchShaders=

[Tweaks]
; Your own overrides, applied underneath the active presets (a preset wins if it
; sets the same name). Every tweakable and its stock value is in
; awtweaks_dump.txt; the ReShade overlay's Advanced section edits them live.
; Notes on the ones explored so far:
;
; Shadows:{High,Very High,Ultra High} Resolution - sun/moon cascade size per in-game
;   quality setting (stock 1024 / 1600 / 2048). Above 2048 needs [Shadows]
;   AtlasScale=2. Ultra uses 6 cascades, Very High 5.
; Sun:Shadow Region Culling - stock true: each cascade only draws objects from
;   baked casting regions. false: every object casts in every cascade (GPU cost).
; Shadows:Tweak Cascade Culling=true - alternative: all regions, but skip objects
;   whose bounding radius (m) is <= the cull radius in cascades 4-6:
;   Shadows:Ultra Cascade 4/5/6 Cull Radius (stock 0.6 / 5.5 / 50),
;   Shadows:Cascade 3/4/5 Cull Radius (Very High, stock 0.65 / 10 / 50).
; Shadow Filtering d3t:Global Bias - depth bias (stock 0.0005); lower = tighter
;   contact shadows, more acne.
; Shadow Filtering d3t:Cascade Filter Size (stock 9) - the sun/moon shadow filter
;   radius in shadow-map texels; bigger cascades need bigger sizes for the same
;   softness. This is the one that changes sun/moon shadow edges. Kept to steps of
;   0.1: AWTweaks passes the two settings below to its shader in the digits after.
; Shadow Filtering d3t:Function (Jitter8, Poisson Disk, Optimised PCF, Spiral
;   Gradient, Vogel Disk Gradient) and Filter Size (stock 5) are NOT read by the
;   sun-shadow shader (it always uses a 12-sample Vogel disk). Filter Size is read by
;   the spotlight shader: the flashlight's and lamps' shadow filter radius in texels.
;   PCF Samples (stock 10) is read by no shader at all.
; AWTweaks:Sun Size - with [Shaders] ShadowShader=Enhanced: sun/moon shadows soften
;   with distance from what casts them, as if the sun were this many degrees wide
;   (real sun 0.5; 0 = the game's filter; max 4.9, steps of 0.1).
; AWTweaks:Contact Shadows - with ShadowShader=Enhanced: screen-space contact shadows
;   traced this many metres towards the sun (0 = off; max 1.98, steps of 0.02),
;   fading out by 50 m.
; AWTweaks:Flashlight Softness - with [Shaders] SpotShader=Enhanced: shadows from the
;   flashlight (and lamps that cast shadows) are sharp where objects touch and soften
;   with distance, as from a lens of this radius in cm (0 = the game's filter; max 9.8,
;   steps of 0.2).
; AWTweaks:Flashlight Contact Shadows - with SpotShader=Enhanced: screen-space contact
;   shadows traced this many metres towards the light (0 = off; max 1.98, steps of 0.02).
;   Shadow Filtering d3t:Filter Size is kept to steps of 0.1: the digits after carry
;   these two settings.
; AWTweaks:GTAO - with [Shaders] AOShader=Enhanced: ground-truth ambient occlusion in
;   place of the game's HBAO+, at this strength (0 = HBAO+; 1 shades creases a little
;   more than HBAO+ and leaves open surfaces unshaded; max 3, steps of 0.1). Radius
;   and amounts still follow the HBAO tweakables.
;   HBAO:Bias is kept to steps of 0.001: the digits after carry this setting.
; HBAO:SmallScaleAO / LargeScaleAO / Power Exponent / Radius In Meters / Bias -
;   ambient occlusion (stock 1.1 / 2 / 2.1 / 50 / 0.1).
; Skin Shader:SSS Width / Follow Surface Scale - skin subsurface scattering, a
;   separable screen-space blur (Jimenez 2012) on characters' skin. Width is in
;   metres; real skin scatters about 1 cm. Follow Surface Scale stops the blur at
;   depth edges; the reference implementation uses 300. Stock 0.0002 / 30000 leave
;   it practically off.
; Character Light Rig:Intensity 1/2/3 Night (stock 0.31 / 0.31 / 0.05) - invisible
;   lights that follow characters, from front-left, front-right and behind. Equal
;   1 and 2 light faces flat from both sides; a weaker 2 shapes them. Day values too.
;   HBAO:Skin Intensity / Eye Intensity have no visible effect.
; Fog:Half Res Mode - stock true; false renders fog at full resolution.
; Volumetric Light:Intensity / Blur Passes / Decay / H-G Phase Constant /
;   Jitter XY / Jitter Z - light shafts (stock 0.55 / 1 / 2 / 0.65 / 0.1 / 0.4).
; Foliage:Small Foliage Draw Distance - metres (stock 60; cutscenes use 4x).
; LOD:LOD detail - higher keeps full-detail models farther (stock 0.3, max 1).
; Untested, direction unknown (go straight to shaders): Grass:Fade Start / Fade End
;   (stock 50 / 2), Alpha To Coverage:Mip Scale / Foliage Mip Scale / Billboard
;   Mip Scale (stock 0.15 / 0.05 / 0) - try them with the overlay sliders.

; ================================================================ Presets
; [Preset:Name] sections apply on top of [Tweaks] while active. Group= allows one
; active preset per group (picking another switches); Description= is shown in
; the overlay. Stock values are in the comments.

[Preset:Ultra+]
Group=Quality
Description=Ultra, sharper: 3072 sun shadow cascades (2.25x the detail), ground-truth ambient occlusion, full-resolution fog and rain, grass and models detailed farther, soft sun/moon shadows and contact shadows, soft flashlight shadows, skin light scattering and better-shaped faces at night. About 13% fewer FPS than Stock.
; Cascade size (stock Ultra 2048, Very High 1600). Needs [Shadows] AtlasScale=2.
Shadows:Ultra High Resolution=3072
Shadows:Very High Resolution=2048
; Ambient occlusion. Stock 1.1 / 2.1.
HBAO:SmallScaleAO=1.4
HBAO:Power Exponent=2.4
; Fog at full resolution. Stock true (half res).
Fog:Half Res Mode=false
; Light-shaft blur. Stock 1.
Volumetric Light:Blur Passes=2
; Grass/small plants drawn farther (metres). Stock 60.
Foliage:Small Foliage Draw Distance=90
; Keep full-detail models farther out: switch distance = this x object size. Stock 0.3 (max 1).
LOD:LOD detail=0.5
; Rain at full resolution. Stock true (half res).
Rain:Half Res Mode=false
; Distance (m) for high-quality character skinning. Stock 16 (max 20).
Skinning:High Quality Skinning Range=20
; Sun/moon shadow edge softness: Cascade Filter Size scales the shadow filter's
; radius in shadow-map texels (at 3072 the same size is 1.5x sharper). Stock 9.
Shadow Filtering d3t:Cascade Filter Size=11
; Flashlight and lamp shadow filter radius in shadow-map texels. Stock 5.
Shadow Filtering d3t:Filter Size=6
; Needs [Shaders] ShadowShader=Enhanced: sun-size soft shadows (degrees) and contact
; shadows (metres). See [Tweaks] notes.
AWTweaks:Sun Size=0.5
AWTweaks:Contact Shadows=0.3
; Needs [Shaders] AOShader=Enhanced: ground-truth ambient occlusion strength.
AWTweaks:GTAO=1
; Needs [Shaders] SpotShader=Enhanced: flashlight (and lamp) shadows soft with distance,
; as from a lens of this radius (cm). See [Tweaks] notes.
AWTweaks:Flashlight Softness=2
; Skin subsurface scattering, as designed: width in metres, depth-edge cut-off.
; Stock 0.0002 / 30000 (practically off). See [Tweaks] notes.
Skin Shader:SSS Width=0.008
Skin Shader:Follow Surface Scale=300
; Character light rig at night: a key light and a weaker fill instead of two equal
; ones, so faces get a lit and a shaded side. Stock 0.31 / 0.31.
Character Light Rig:Intensity 1 Night=0.5
Character Light Rig:Intensity 2 Night=0.1

[Preset:Cinematic]
Group=Quality
Description=Maximum: 4096 cascades (4x Ultra), every object casts sun/moon shadows, grass drawn 4x farther like cutscenes, full-detail models everywhere, softer sun/moon shadows and longer contact shadows, softer flashlight shadows, stronger ground-truth ambient occlusion, skin light scattering and better-shaped faces at night. About 19% fewer FPS than Stock.
Shadows:Ultra High Resolution=4096
Shadows:Very High Resolution=4096
; Every object casts in every cascade. Stock true (baked regions only).
Sun:Shadow Region Culling=false
HBAO:SmallScaleAO=1.4
HBAO:LargeScaleAO=2
HBAO:Power Exponent=2.4
Fog:Half Res Mode=false
; Light-shaft strength. Stock 0.55.
Volumetric Light:Intensity=0.7
Volumetric Light:Blur Passes=2
; Small foliage 4x farther - what the game itself uses in cutscenes. Stock 60.
Foliage:Small Foliage Draw Distance=240
; Full-detail models as far as the engine allows. Stock 0.3.
LOD:LOD detail=1
Rain:Half Res Mode=false
Skinning:High Quality Skinning Range=20
; Shadow edge softness for 4096 maps: still sharper than stock (see Ultra+ notes).
Shadow Filtering d3t:Cascade Filter Size=13
Shadow Filtering d3t:Filter Size=7
AWTweaks:Sun Size=1
AWTweaks:Contact Shadows=0.6
AWTweaks:GTAO=1.5
AWTweaks:Flashlight Softness=3
Skin Shader:SSS Width=0.008
Skin Shader:Follow Surface Scale=300
Character Light Rig:Intensity 1 Night=0.5
Character Light Rig:Intensity 2 Night=0.1

[Preset:Darker Nights]
Group=Look
Description=Nights where the flashlight matters: less eye adaptation, no invisible light following Alan, dimmer fill lights on characters, darker sky and fog.
; How far exposure may brighten a dark scene. Stock 10 (range 0.01..10).
Auto-exposure:Max Exposure (Night)=4
; Ambient light that follows the player. Stock 0.1518 grey.
Player Ambient:Intensity=0.06, 0.06, 0.06, 0
; Fake 3-light rig on characters at night. Stock 0.31 / 0.31 / 0.05, indoors 1.
Character Light Rig:Intensity 1 Night=0.12
Character Light Rig:Intensity 2 Night=0.12
Character Light Rig:Intensity 3 Night=0.02
Character Light Rig:Night Intensity Indoors=0.5
; Fog self-illumination. Stock 0.6.
Fog:Ambient=0.4
; Night sky brightness. Stock 3.2.
Night Sky:Brightness=2.4
